# Публикация статической демо-версии ресторана (папка demo/) на GitHub Pages.
# Один раз: Settings → Pages → Source: GitHub Actions. Запуск вручную: Actions → «Демо ресторана на GitHub Pages» → Run workflow.
name: Демо ресторана на GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo/
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
